services:
  eligibility-service:
    build:
      context: .
      dockerfile: eligibility-service/Dockerfile
    ports: ["8081:8080"]
    environment: ["SERVER_PORT=8080"]
  application-service:
    build:
      context: .
      dockerfile: application-service/Dockerfile
    ports: ["8080:8080"]
    depends_on: [eligibility-service]
    environment:
      ELIGIBILITY_BASE_URL: http://eligibility-service:8080
      ELIGIBILITY_CONNECT_TIMEOUT: 1s
      ELIGIBILITY_READ_TIMEOUT: 2s
