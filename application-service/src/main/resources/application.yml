server:
  port: 8080
clients:
  eligibility:
    base-url: ${ELIGIBILITY_BASE_URL:http://localhost:8081}
    connect-timeout: ${ELIGIBILITY_CONNECT_TIMEOUT:1s}
    read-timeout: ${ELIGIBILITY_READ_TIMEOUT:2s}
management.endpoints.web.exposure.include: health
logging.pattern.level: "%5p tenantId=%X{tenantId} requestId=%X{requestId} traceId=%X{traceId}"
