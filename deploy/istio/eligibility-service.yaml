apiVersion: apps/v1
kind: Deployment
metadata: {name: eligibility-service, namespace: service-communication}
spec:
  replicas: 1
  selector: {matchLabels: {app: eligibility-service}}
  template:
    metadata: {labels: {app: eligibility-service}}
    spec:
      containers:
        - name: eligibility-service
          image: example/eligibility-service:replace-me
          ports: [{containerPort: 8080}]
          env: [{name: SERVER_PORT, value: "8080"}]
          readinessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: eligibility-service, namespace: service-communication}
spec: {selector: {app: eligibility-service}, ports: [{port: 8080, targetPort: 8080}]}
