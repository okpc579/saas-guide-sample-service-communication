apiVersion: apps/v1
kind: Deployment
metadata: {name: application-service, namespace: service-communication}
spec:
  replicas: 1
  selector: {matchLabels: {app: application-service}}
  template:
    metadata: {labels: {app: application-service}}
    spec:
      containers:
        - name: application-service
          image: example/application-service:replace-me
          ports: [{containerPort: 8080}]
          env:
            - {name: ELIGIBILITY_BASE_URL, value: "http://eligibility-service:8080"}
            - {name: SPRING_PROFILES_ACTIVE, value: mesh-timeout}
          readinessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: application-service, namespace: service-communication}
spec: {selector: {app: application-service}, ports: [{port: 8080, targetPort: 8080}]}
